<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Social Media App</title>
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Mini Social Media</h1>
        <button>Logout</button>
    </header>

    <hr>

    <!-- User Profile -->
    <section>
        <h2>User Profile</h2>
        <img src="https://via.placeholder.com/100" alt="Profile Picture">
        <h3>sandhiya</h3>
        <p>B.Sc AI & ML Student</p>
        <button>Follow</button>
    </section>

    <hr>

    <!-- Create Post -->
    <section>
        <h2>Create Post</h2>
        <textarea rows="4" cols="50" placeholder="What's on your mind?"></textarea>
        <br><br>
        <button>Post</button>
    </section>

    <hr>

    <!-- Feed Section -->
    <section>
        <h2>News Feed</h2>

        <div>
            <h3>John Doe</h3>
            <p>Welcome to my first post!</p>

            <button>👍 Like</button>
            <span>10 Likes</span>

            <h4>Comments</h4>
            <ul>
                <li>Nice Post!</li>
                <li>Great Work!</li>
            </ul>

            <input type="text" placeholder="Add a comment">
            <button>Comment</button>
        </div>

        <hr>

        <div>
            <h3>sandhiya</h3>
            <p>Learning Django and Web Development.</p>

            <button>👍 Like</button>
            <span>5 Likes</span>

            <h4>Comments</h4>
            <ul>
                <li>Awesome!</li>
            </ul>

            <input type="text" placeholder="Add a comment">
            <button>Comment</button>
        </div>

    </section>

</body>
</html>
